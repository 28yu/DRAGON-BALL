# 中古相場の自動取得（1日1回）
# 毎朝 6:17（日本時間）に tools/market/collect.mjs を実行し、
# data/market-history.json に変化があれば main に記録する。
# GitHub の「Actions」タブから手動で実行することもできる（Run workflow）。
# 取得プログラム（tools/market/）を更新して main に送ったときにも自動で実行される。
name: 中古相場の自動取得

on:
  schedule:
    - cron: "17 21 * * *" # 21:17 UTC = 6:17 JST
  workflow_dispatch:
  # 取得プログラムや設定を更新して main に送ったときにもすぐ実行する
  push:
    branches: [main]
    paths:
      - "tools/market/**"
      - ".github/workflows/market.yml"

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 相場を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          MARKET_DEBUG: "1" # ページ構造の調査中（調査が終わったら削除する）
        run: node tools/market/collect.mjs

      - name: データチェック
        run: node tools/validate.mjs

      - name: 変更があれば記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market-history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "中古相場を自動更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
            git push
          fi
