# 中古相場の自動取得（1日1回）
# 毎朝 6:17（日本時間）に tools/market/collect.mjs（相場）と tools/market/listings.mjs（出品中の一覧）を実行し、
# data/market-history.json・data/listings.json に変化があれば main に記録する。
# GitHub の「Actions」タブから手動で実行することもできる（Run workflow）。
# 取得プログラム（tools/market/）を更新して main に送ったときにも自動で実行される。
name: 中古相場の自動取得

on:
  schedule:
    - cron: "17 21 * * *" # 21:17 UTC = 6:17 JST
  workflow_dispatch:
  # 取得プログラムや設定を更新して main に送ったときにもすぐ実行する
  push:
    branches: [main]
    paths:
      - "tools/market/**"
      - ".github/workflows/market.yml"

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # フィギュア1体ずつも取得するため（約110件、サイトごとに数秒の間隔をあける）余裕を持たせる
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 相場を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: node tools/market/collect.mjs

      # 出品中の一覧（2026-10-08 追加）。失敗しても相場の記録は保存する
      - name: 出品中の一覧を取得
        continue-on-error: true
        run: node tools/market/listings.mjs

      - name: データチェック
        run: node tools/validate.mjs

      - name: 変更があれば記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market-history.json data/listings.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "中古相場を自動更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
            # 取得中（十数分）に main へ別の変更が送られていると送信が拒否されるため、
            # 最新を取り込んでから送る。ぶつかったときは間隔をあけて最大4回やり直す
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              echo "送信できなかったため $((i * 10)) 秒後にやり直します"
              sleep $((i * 10))
            done
            exit 1
          fi
